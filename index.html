<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMC Jal Setu — Water Distribution Monitoring, Ahmedabad Smart City</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Theme tokens — light is the default; [data-theme="dark"] on <html> switches the palette ===== */
:root{
  --bg:#EEF2F6; --panel:#FFFFFF; --panel2:#F3F6FA; --line:#DCE3EA; --line-soft:#E8EDF2;
  --text:#101B27; --text-dim:#45566B; --text-mute:#6B7C8F;
  --teal:#0D9488; --teal-dim:#0D9488; --teal-dim-fg:#F0FDFA; --teal-dim-border:#0B7A70; --sky:#0284C7;
  --green:#15803D; --green-bg:#E5F6EA; --green-fg:#15803D;
  --amber:#B45309; --amber-bg:#FDF0DD; --amber-fg:#B45309;
  --red:#B91C1C; --red-bg:#FBE9E9; --red-fg:#B91C1C;
  --purple:#7C3AED; --purple-bg:#F1EBFB; --purple-fg:#7C3AED;
  --orange-bg:#FCE9D6; --orange-fg:#9A3412;
  --track:#E2E8F0;
  --alert-border:#F3C6C6; --alert-fg:#B91C1C;
  --river:#B7CFE0; --river-core:#6FA8D0; --river-label:#5E7A93;
  --wire:#C1CBD6;
  --shadow-scrim:rgba(15,23,32,.4); --shadow-drop:rgba(15,23,32,.18);
  --mono: 'IBM Plex Mono', monospace; --sans:'IBM Plex Sans', sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0A1420; --panel:#0F1E2E; --panel2:#13253A; --line:#1E3450; --line-soft:#17293E;
  --text:#DCE7F2; --text-dim:#8AA0B8; --text-mute:#5A7089;
  --teal:#2DD4BF; --teal-dim:#0F6E56; --teal-dim-fg:#D5FBF3; --teal-dim-border:#146152; --sky:#38BDF8;
  --green:#22C55E; --green-bg:#0F2A1C; --green-fg:#7BE8A0;
  --amber:#F5A524; --amber-bg:#2E2308; --amber-fg:#FFCB6B;
  --red:#F14747; --red-bg:#331014; --red-fg:#FF8A8A;
  --purple:#A78BFA; --purple-bg:#221A3D; --purple-fg:#C9B8FF;
  --orange-bg:#331d08; --orange-fg:#FFB870;
  --track:#08121C;
  --alert-border:#4a1f24; --alert-fg:#FF9C9C;
  --river:#3B6D8C; --river-core:#5B9BC4; --river-label:#6F93B0;
  --wire:#3D5972;
  --shadow-scrim:rgba(3,8,14,.6); --shadow-drop:rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:var(--sans); height:100%;}
body{display:flex; min-height:100vh; font-size:14px; transition:background-color .15s ease, color .15s ease;}
#sidebar, #main, #topbar, .panel, .kpi, .paramcard, .tankcard, .zonecard, #zoneDrawer, .pill, select, input[type=text], .btn{transition:background-color .15s ease, border-color .15s ease, color .15s ease;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== Sidebar ===== */
#sidebar{width:220px; min-width:220px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
.brand{padding:20px 18px 16px; border-bottom:1px solid var(--line);}
.brand-title{font-size:15px; font-weight:600; letter-spacing:0.3px;}
.brand-sub{font-size:11px; color:var(--text-dim); margin-top:3px; font-family:var(--mono);}
nav{flex:1; padding:12px 10px; display:flex; flex-direction:column; gap:2px;}
.navbtn{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; color:var(--text-dim); cursor:pointer; font-size:13px; border:1px solid transparent; transition:background .12s;}
.navbtn:hover{background:var(--panel2); color:var(--text);}
.navbtn.active{background:var(--teal-dim); color:var(--teal-dim-fg); border-color:var(--teal-dim-border);}
.navbtn .dot{width:6px; height:6px; border-radius:50%; background:var(--text-mute); flex-shrink:0;}
.navbtn.active .dot{background:var(--teal);}
.sidebar-foot{padding:14px 18px; border-top:1px solid var(--line); font-size:10.5px; color:var(--text-mute); font-family:var(--mono); line-height:1.6;}

/* ===== Main ===== */
#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 26px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5;}
#topbar h1{font-size:16px; font-weight:600;}
#topbar .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.topbar-right{display:flex; align-items:center; gap:18px; font-family:var(--mono); font-size:12px; color:var(--text-dim);}
.clock{color:var(--teal);}
.pill{display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line); padding:5px 10px; border-radius:20px;}
.theme-toggle{cursor:pointer; font-family:var(--sans); font-size:12px; color:var(--text-dim); font-weight:500;}
.theme-toggle:hover{border-color:var(--teal); color:var(--teal);}
.theme-toggle #themeIcon{font-size:13px; line-height:1;}
.pill.alertpill{border-color:var(--alert-border); color:var(--alert-fg);}
.blink{width:7px; height:7px; border-radius:50%; background:var(--red); animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1} 50%{opacity:.25}}

#view{padding:22px 26px 60px; overflow-y:auto;}

/* ===== Common blocks ===== */
.kpirow{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:22px;}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px;}
.kpi .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px;}
.kpi .val{font-family:var(--mono); font-size:24px; font-weight:600; margin-top:6px; color:var(--text);}
.kpi .val.teal{color:var(--teal);} .kpi .val.amber{color:var(--amber);} .kpi .val.red{color:var(--red);} .kpi .val.green{color:var(--green);}
.kpi .unit{font-size:12px; color:var(--text-mute); font-weight:400; margin-left:3px;}
.kpi .delta{font-size:11px; margin-top:5px; color:var(--text-mute);}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:20px;}
.panel h2{font-size:13.5px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
.panel h2 .cnt{font-family:var(--mono); font-size:11px; color:var(--text-dim); font-weight:400;}
.grid2{display:grid; grid-template-columns:1.4fr 1fr; gap:20px;}
@media (max-width:1100px){.grid2{grid-template-columns:1fr;}}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-mute); border-bottom:1px solid var(--line); padding:8px 10px; font-weight:500; white-space:nowrap;}
td{padding:9px 10px; border-bottom:1px solid var(--line-soft); font-family:var(--mono); white-space:nowrap; color:var(--text);}
tr:hover td{background:var(--panel2);}
td.name{font-family:var(--sans); color:var(--text);}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-family:var(--sans); padding:3px 9px; border-radius:20px; font-weight:500; white-space:nowrap;}
.b-normal{background:var(--green-bg); color:var(--green-fg);}
.b-low{background:var(--amber-bg); color:var(--amber-fg);}
.b-critical{background:var(--red-bg); color:var(--red-fg);}
.b-leak{background:var(--red-bg); color:var(--red-fg);}
.b-block{background:var(--orange-bg); color:var(--orange-fg);}
.b-sensor{background:var(--purple-bg); color:var(--purple-fg);}
.badge .bdot{width:6px; height:6px; border-radius:50%; background:currentColor;}

select, input[type=text]{background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:7px 10px; border-radius:6px; font-family:var(--sans); font-size:12.5px; outline:none;}
select:focus, input:focus{border-color:var(--teal);}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.btn{background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:8px 14px; border-radius:6px; font-size:12.5px; cursor:pointer; font-family:var(--sans); display:inline-flex; align-items:center; gap:6px;}
.btn:hover{border-color:var(--teal); color:var(--teal);}
.btn.primary{background:var(--teal-dim); border-color:var(--teal-dim-border); color:var(--teal-dim-fg);}

.tankcard{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:14px; display:flex; gap:14px;}
.gaugewrap{width:46px; height:100px; background:var(--track); border:1px solid var(--line); border-radius:5px; position:relative; overflow:hidden; flex-shrink:0;}
.gaugefill{position:absolute; bottom:0; left:0; right:0; transition:height .3s;}
.gaugelabel{position:absolute; top:4px; left:0; right:0; text-align:center; font-family:var(--mono); font-size:10px; color:var(--text-dim); z-index:2;}
.tankinfo{flex:1; min-width:0;}
.tankinfo .tname{font-size:14px; font-weight:600; margin-bottom:2px; letter-spacing:.1px;}
.tankinfo .ttype{font-size:10.5px; color:var(--text-mute); font-family:var(--mono); margin-bottom:9px;}
.statrow{display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; font-size:11px; color:var(--text-dim); font-family:var(--mono);}
.statrow b{color:var(--text); font-weight:500;}
.tanksgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px;}

/* ===== Spec grid — uniform label/value blocks for dense asset detail (tank cards, drawer rows) ===== */
.chiprow{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:2px;}
.specgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; margin-top:13px; padding-top:13px; border-top:1px solid var(--line);}
.specgrid.tight{gap:9px 16px; margin-top:10px; padding-top:10px;}
.spec{display:flex; flex-direction:column; gap:3px; min-width:0;}
.spec .specl{font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.spec .specv{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--text); line-height:1.3; overflow-wrap:break-word;}
.spec .specv .u{font-family:var(--sans); font-weight:400; color:var(--text-mute); font-size:10.5px; margin-left:3px;}
.spec.span2{grid-column:span 2;}

.zonecard{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:16px;}
.barmini{height:8px; background:var(--track); border-radius:4px; overflow:hidden; margin:8px 0;}
.barmini > div{height:100%;}

.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--text-dim); margin-top:10px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:9px; height:9px; border-radius:50%; display:inline-block;}

/* ===== Key-parameter category cards (Overview + reused on individual tabs) ===== */
.paramgrid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
@media (max-width:1180px){.paramgrid{grid-template-columns:repeat(2, 1fr);}}
@media (max-width:680px){.paramgrid{grid-template-columns:1fr;}}
.paramcard{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:16px 18px 6px;}
.paramcard .pctitle{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; margin-bottom:4px; padding-bottom:11px; border-bottom:1px solid var(--line);}
.paramcard .pctitle .pcdot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.paramrow{padding:10px 0; border-bottom:1px solid var(--line-soft); display:flex; flex-direction:column; gap:4px;}
.paramrow:last-child{border-bottom:none;}
.paramrow .plbl{font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-mute);}
.paramrow .pval{font-family:var(--mono); font-weight:600; font-size:14px; line-height:1.3;}
.paramrow .pval .pnote{font-family:var(--sans); font-weight:400; color:var(--text-mute); font-size:11px; margin-left:6px;}
.pval.ok{color:var(--teal);} .pval.warn{color:var(--amber);} .pval.bad{color:var(--red);} .pval.neutral{color:var(--text);}
.flagchip{display:inline-block; font-size:9.5px; font-family:var(--sans); font-weight:600; text-transform:uppercase; letter-spacing:.3px; padding:2px 6px; border-radius:3px; margin-left:6px; vertical-align:middle;}
.flagchip.bad{background:var(--red-bg); color:var(--red-fg);}
.flagchip.warn{background:var(--amber-bg); color:var(--amber-fg);}

.alertrow{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-soft); align-items:flex-start;}
.alertrow:last-child{border-bottom:none;}
.alertsev{width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0;}
.alertbody{flex:1; min-width:0;}
.alerttitle{font-size:12.5px; font-weight:500;}
.alertmeta{font-size:11px; color:var(--text-mute); font-family:var(--mono); margin-top:2px;}
.alertaction{font-size:11px; color:var(--text-dim); margin-top:4px;}

.hint{font-size:11px; color:var(--text-mute); margin-top:10px; line-height:1.6;}
.sectiontitle{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-mute); margin:22px 0 10px;}
.sectiontitle:first-child{margin-top:0;}
.svgwrap{width:100%; overflow-x:auto;}

/* ===== Zone detail drawer (right sidebar) ===== */
#drawerBackdrop{position:fixed; inset:0; background:var(--shadow-scrim); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
#drawerBackdrop.open{opacity:1; pointer-events:auto;}
#zoneDrawer{position:fixed; top:0; right:0; height:100vh; width:440px; max-width:94vw; background:var(--panel); border-left:1px solid var(--line); z-index:50; transform:translateX(100%); transition:transform .25s cubic-bezier(.2,.8,.3,1); overflow-y:auto; box-shadow:-8px 0 24px var(--shadow-drop);}
#zoneDrawer.open{transform:translateX(0);}
.drawer-head{position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line); padding:18px 22px; display:flex; justify-content:space-between; align-items:flex-start; z-index:2;}
.drawer-close{cursor:pointer; color:var(--text-dim); font-size:20px; line-height:1; padding:4px 8px; border-radius:6px;}
.drawer-close:hover{background:var(--panel2); color:var(--text);}
.drawer-body{padding:18px 22px 40px;}
.drawer-badge{display:inline-block; font-size:10px; font-family:var(--mono); padding:3px 8px; border-radius:4px; margin-top:6px; margin-right:6px;}
.mini-gauge{width:8px; height:34px; background:var(--track); border:1px solid var(--line); border-radius:3px; position:relative; overflow:hidden; flex-shrink:0;}
.mini-gauge > div{position:absolute; bottom:0; left:0; right:0;}
.drawer-tankrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft);}
.drawer-tankrow .tinfo{flex:1; min-width:0; font-size:12px;}
.drawer-tankrow .tinfo b{font-size:12.5px; font-weight:600;}
.drawer-tankrow .tstats{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin-top:2px;}
</style>
</head>

<script>
/* Applied immediately, before the rest of the page paints, so a saved dark preference doesn't flash light first. */
(function(){
  try{
    var saved = localStorage.getItem('jalsetu-theme');
    if(saved==='dark') document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
</script>

<div id="sidebar">
  <div class="brand">
    <div class="brand-title">AMC Jal Setu</div>
    <div class="brand-sub">Water Distribution SCADA · Demo</div>
  </div>
  <nav id="nav"></nav>
  <div class="sidebar-foot">Ahmedabad Municipal Corporation<br>Smart City Water Cell<br>Simulated data · demo build</div>
</div>

<div id="main">
  <div id="topbar">
    <div>
      <h1 id="viewtitle">Overview</h1>
      <div class="sub" id="viewsub">City-wide water production, storage and distribution status</div>
    </div>
    <div class="topbar-right">
      <div class="pill alertpill" id="alertpill"><span class="blink"></span><span id="alertcount">0 active alerts</span></div>
      <div class="pill"><span>Ahmedabad</span></div>
      <div class="pill clock" id="clock">--:--:--</div>
      <button class="pill theme-toggle" id="themeToggle" onclick="toggleTheme()" type="button" aria-label="Switch color theme">
        <span id="themeIcon" aria-hidden="true">☀</span><span id="themeLabel">Light</span>
      </button>
    </div>
  </div>
  <div id="view"></div>
</div>

<div id="drawerBackdrop" onclick="closeDrawer()"></div>
<div id="zoneDrawer" role="dialog" aria-label="Zone detail"></div>

<script>
/* =========================================================
   DATA MODEL — synthetic demo data for Ahmedabad Municipal Corporation
   ========================================================= */

/* peakFactor = peak-hour demand as a multiple of average daily demand (hydraulic design factor).
   seasonalVariationPct = summer peak-month demand uplift over annual average (evaporative/cooling load).
   fireFlowLPS = design fire-fighting flow reserved on the network per CPHEEO/IS 3844 (higher for
   industrial/commercial-dense zones), on top of domestic demand. */
const ZONES = [
  {id:'CZ', name:'Central Zone', areas:['Khadia','Raikhad','Kalupur','Dariapur'], population:380000, peakFactor:2.1, seasonalVariationPct:18, fireFlowLPS:90},
  {id:'NZ', name:'North Zone', areas:['Naranpura','Sabarmati','Chandkheda (N)','Motera'], population:520000, peakFactor:1.9, seasonalVariationPct:22, fireFlowLPS:75},
  {id:'EZ', name:'East Zone', areas:['Vastral','Nikol','Odhav','Amraiwadi'], population:610000, peakFactor:2.0, seasonalVariationPct:25, fireFlowLPS:95},
  {id:'WZ', name:'West Zone', areas:['Vastrapur','Bodakdev','Thaltej','Navrangpura'], population:470000, peakFactor:1.85, seasonalVariationPct:20, fireFlowLPS:80},
  {id:'SZ', name:'South Zone', areas:['Maninagar','Isanpur','Vatva','Ghodasar'], population:550000, peakFactor:1.95, seasonalVariationPct:24, fireFlowLPS:85},
  {id:'NWZ', name:'North-West Zone', areas:['Ranip','Chandlodia','Gota','Chandkheda (W)'], population:430000, peakFactor:1.8, seasonalVariationPct:19, fireFlowLPS:60},
  {id:'SWZ', name:'South-West Zone', areas:['Bopal','South Bopal','Sarkhej','Vejalpur'], population:490000, peakFactor:1.85, seasonalVariationPct:21, fireFlowLPS:65},
];

const WTPS = ['Jaspur WTP','Raska WTP','Kotarpur WTP'];

/* Source & supply — capacity/output in MLD, reliability = uptime over trailing 90 days, reserve = clear-water
   reservoir carry-over at current output rate. Keyed by WTP name so it lines up with WTP_POS / LINES.from. */
const WTP_INFO = {
  'Jaspur WTP':   {capacityMLD:12,  reliabilityPct:97.5, reserveHrs:6},
  'Raska WTP':    {capacityMLD:30,  reliabilityPct:96.2, reserveHrs:5},
  'Kotarpur WTP': {capacityMLD:24,  reliabilityPct:98.1, reserveHrs:8},
};

/* Water age = mean residence time from clear-water tank to this storage point (hrs), from hydraulic model.
   Contamination risk = combined read on chlorine residual + turbidity + water age (Low/Medium/High).
   Valve = downstream control valve position. SCADA = RTU/telemetry link health for this asset.
   lastMaint/nextMaint = ESR/GSR mechanical + water-quality maintenance cycle (ISO date). */
const TANKS = [
  {id:'CZ-ESR-01', name:'Khadia ESR', type:'Elevated (ESR)', zone:'CZ', cap:4500, level:78, inflow:3800, outflow:3650, turbidity:0.8, ph:7.1, chlorine:0.32, pump:'Running', status:'Normal', waterAge:6, contam:'Low', valve:'Open', scada:'Online', lastMaint:'2026-07-18', nextMaint:'2026-10-18'},
  {id:'CZ-GSR-01', name:'Raikhad GSR', type:'Ground (GSR)', zone:'CZ', cap:9000, level:62, inflow:7200, outflow:7050, turbidity:1.1, ph:7.0, chlorine:0.28, pump:'Running', status:'Normal', waterAge:9, contam:'Medium', valve:'Open', scada:'Online', lastMaint:'2026-06-22', nextMaint:'2026-09-22'},
  {id:'NZ-ESR-01', name:'Naranpura ESR', type:'Elevated (ESR)', zone:'NZ', cap:6000, level:45, inflow:5100, outflow:5400, turbidity:0.9, ph:7.2, chlorine:0.30, pump:'Running', status:'Low', waterAge:14, contam:'Medium', valve:'Throttled', scada:'Online', lastMaint:'2026-05-10', nextMaint:'2026-08-10'},

/* Day-over-day comparison — % change in effective supply vs yesterday, per zone.

function zoneSupplyKLD(zid){ return tanksIn(zid).reduce((s,t)=>s+t.outflow,0); }
function zoneLossKLD(zid){ return linesIn(zid).filter(l=>l.type==='Distribution Main' && l.output!==null).reduce((s,l)=>s+(l.input-l.output),0); }
function zoneDeliveredKLD(zid){ return Math.max(0, zoneSupplyKLD(zid)-zoneLossKLD(zid)); }
function zoneLPCD(zid){ const z=zoneOf(zid); return Math.round(zoneDeliveredKLD(zid)*1000/z.population); }
function zoneYesterdaySupplyKLD(zid){ return zoneSupplyKLD(zid)/(1+(YESTERDAY_CHANGE_PCT[zid]||0)/100); }
function zoneYesterdayDeliveredKLD(zid){ return zoneDeliveredKLD(zid)/(1+(YESTERDAY_CHANGE_PCT[zid]||0)/100); }

/* Build unified alert list from tanks + lines */
function buildAlerts(){
  const alerts = [];
  LINES.forEach(l=>{
    if(l.status==='Leakage Suspected'){
      const lossKld = l.output===null? null : (l.input-l.output);
      alerts.push({sev:'critical', type:'Leakage', line:l.id, zone:l.zone, location:l.to, param:`NRW ${((l.input-l.output)/l.input*100).toFixed(1)}%, pressure drop ${l.pin}→${l.pout} mwc`, loss:lossKld, method:l.method, action:'Dispatch leak-detection crew; isolate DMA sub-zone valves and re-survey.'});
    } else if(l.status==='Blockage Suspected'){
      alerts.push({sev:'critical', type:'Blockage', line:l.id, zone:l.zone, location:l.to, param:`Velocity ${l.vel} m/s (design ~1.0), upstream pressure ${l.pin} mwc`, loss:null, method:l.method, action:'Schedule mechanical cleaning / pigging; verify valve position at chamber.'});
    } else if(l.status==='Sensor Offline'){
      alerts.push({sev:'warning', type:'Sensor fault', line:l.id, zone:l.zone, location:l.to, param:'Flow meter not reporting output', loss:null, method:l.method, action:'Field team to inspect RTU / meter communication link.'});
    }
  });
  TANKS.forEach(t=>{
    if(t.status==='Critical'){
      alerts.push({sev:'critical', type:'Low tank level', line:t.id, zone:t.zone, location:t.name, param:`Level ${t.level}% — outflow exceeding inflow`, loss:null, method:'SCADA level deviation', action:'Increase trunk main supply or reduce outflow scheduling for this ESR.'});
    } else if(t.status==='Low'){
      alerts.push({sev:'warning', type:'Low tank level', line:t.id, zone:t.zone, location:t.name, param:`Level ${t.level}% — trending down`, loss:null, method:'SCADA level deviation', action:'Monitor next fill cycle; adjust pumping schedule if trend continues.'});
    }
  });
  return alerts;
}
const ALERTS = buildAlerts();

function statusBadge(status){
  const map = {
    'Normal':'b-normal', 'Running':'b-normal', 'Low':'b-low', 'Critical':'b-critical',
    'Leakage Suspected':'b-leak', 'Blockage Suspected':'b-block', 'Sensor Offline':'b-sensor'
  };
  const cls = map[status] || 'b-normal';
  return `<span class="badge ${cls}"><span class="bdot"></span>${status}</span>`;
}
function levelColor(pct){
  if(pct<30) return 'var(--red)';
  if(pct<50) return 'var(--amber)';
  return 'var(--teal)';
}
function sevColor(sev){ return sev==='critical' ? 'var(--red)' : sev==='warning' ? 'var(--amber)' : 'var(--teal)'; }

/* Uniform label/value block for dense asset detail — used on tank cards and inside the zone drawer so every

function spec(label, value, color, unit, wide){

}
function specGrid(items, tight){ return `<div class="specgrid${tight?' tight':''}">${items.join('')}</div>`; }

}
function openWtpDrawer(name, feedLines, totalFeed){
  const rows = feedLines.map(l=>{
    const z = zoneOf(l.zone);
    return `<div style="display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px; cursor:pointer;" onclick="openZoneDrawer('${l.zone}')">

      <span style="font-family:var(--mono);">${fmt(l.input)} KLD</span>
    </div>`;
  }).join('');
  const w = WTP_INFO[name] || {capacityMLD:null, reliabilityPct:null, reserveHrs:null};

  document.getElementById('zoneDrawer').innerHTML = `
    <div class="drawer-head">

        <div class="kpi"><div class="lbl">Output</div><div class="val teal">${fmt(outputMLD,1)}<span class="unit">MLD</span></div><div class="delta">${util!==null?fmt(util,1)+'% utilised':''}</div></div>

  const lossKLD = zoneLossKLD(zid);

  if(zid===minSupplyZone.id) badges.push(`<span class="drawer-badge" style="background:var(--amber-bg); color:var(--amber-fg);">Least supplied area</span>`);
  if(zid===maxLPCDZone.id) badges.push(`<span class="drawer-badge" style="background:var(--green-bg); color:var(--green-fg);">Best per-person supply</span>`);

        <div style="font-size:11.5px; color:var(--text-dim); margin-top:2px;">${z.areas.join(', ')}</div>

        <div class="kpi"><div class="lbl">Demand (135 LPCD)</div><div class="val">${fmt(demandMLD,1)}<span class="unit">MLD</span></div></div>
        <div class="kpi"><div class="lbl">Delivered today</div><div class="val teal">${fmt(deliveredMLD,1)}<span class="unit">MLD</span></div><div class="delta" style="color:${changePct>=0?'var(--green)':'var(--red)'}">${changePct>=0?'▲':'▼'} ${fmt(Math.abs(changePct),1)}% vs yesterday (${fmt(yesterdayMLD,1)} MLD)</div></div>

        <div class="kpi"><div class="lbl">Active alerts</div><div class="val ${za.length?'red':'green'}">${za.length}</div></div>
        <div class="kpi"><div class="lbl">Peak-hour demand</div><div class="val ${peakMLD>deliveredMLD?'amber':''}">${fmt(peakMLD,1)}<span class="unit">MLD ×${z.peakFactor}</span></div></div>

        const contamBg = t.contam==='High'?'var(--red-bg)':t.contam==='Medium'?'var(--amber-bg)':'var(--green-bg)';
        const contamFg = t.contam==='High'?'var(--red-fg)':t.contam==='Medium'?'var(--amber-fg)':'var(--green-fg)';

        return `

          <div style="color:var(--text-dim); font-size:11.5px; margin-top:2px;">${l.from} → ${l.to}</div>

            spec('Material', l.material),
            spec('In / Out', `${fmt(l.input)} / ${l.output===null?'—':fmt(l.output)}`, null, 'KLD'),
            spec('NRW', nrw===null?'—':fmt(nrw,1), nrwCol, nrw===null?'':'%'),
            spec('Pressure in/out', `${l.pin}${l.pout===null?'':'/'+l.pout}`, null, `mwc (PN${l.pressureRating})`),
            spec('Roughness (C)', l.roughness, l.roughness<ROUGHNESS_RISK_MAX?'var(--red)':null),
            spec('Age / Length', `${l.age} / ${l.length}`, null, 'yr · km'),
          ], true)}
        </div>`;
      }).join('')}

      <div class="sectiontitle">Alerts</div>
      ${za.length===0 ? '<div class="hint">No active alerts in this zone.</div>' : za.map(a=>`
        <div class="alertrow">
          <div class="alertsev" style="background:${sevColor(a.sev)}"></div>
          <div class="alertbody">
            <div class="alerttitle">${a.type} — ${a.location}</div>
            <div class="alertmeta">${a.param}</div>

    </div>`;
}

/* =========================================================
   KEY PARAMETERS — 6-category summary shown on the Overview tab.
   Each card's dot rolls up to the worst state of its own rows (ok/warn/bad); each row is independently
   colour-coded against its own engineering norm so the reading that needs attention is visible at a glance.
   ========================================================= */
function paramCard(title, dotState, rowsHtml){
  const dotCol = dotState==='bad' ? 'var(--red)' : dotState==='warn' ? 'var(--amber)' : 'var(--teal)';
  return `<div class="paramcard">
    <div class="pctitle"><span class="pcdot" style="background:${dotCol}"></span>${title}</div>
    ${rowsHtml}
  </div>`;
}
function prow(label, value, cls, note){
  return `<div class="paramrow"><span class="plbl">${label}</span><span class="pval ${cls||'neutral'}">${value}${note?`<span class="pnote">${note}</span>`:''}</span></div>`;
}
function worst(...states){ return states.includes('bad') ? 'bad' : states.includes('warn') ? 'warn' : 'ok'; }

function keyParamsPanels(){
  // 1. Water quality
  const clCls = chlorineBelowNorm>0 ? 'bad' : 'ok';
  const turbCls = turbidityAboveNorm>0 ? 'warn' : 'ok';
  const phCls = phOutOfRange>0 ? 'bad' : 'ok';
  const contamCls = contamHigh>0 ? 'bad' : contamMedium>0 ? 'warn' : 'ok';
  const wqState = worst(clCls, turbCls, phCls, contamCls);
  const wq = paramCard('Water quality', wqState,
    prow('Residual chlorine (avg)', `${fmt(avgChlorine,2)} mg/L`, clCls, `norm ≥${CL_NORM_MIN.toFixed(2)}${chlorineBelowNorm?` · ${chlorineBelowNorm} below`:''}`) +
    prow('Turbidity (avg)', `${fmt(avgTurbidity,2)} NTU`, turbCls, `norm ≤${TURB_NORM_MAX.toFixed(1)}${turbidityAboveNorm?` · ${turbidityAboveNorm} above`:''}`) +
    prow('pH (range)', `${fmt(phMin,1)}–${fmt(phMax,1)}`, phCls, `norm ${PH_NORM[0]}–${PH_NORM[1]}`) +
    prow('Contamination risk', contamHigh>0?`${contamHigh} High`:contamMedium>0?`${contamMedium} Medium`:'All Low', contamCls, contamHigh>0&&contamMedium>0?`· ${contamMedium} Medium`:'') +
    prow('Water age (avg / max)', `${fmt(avgWaterAge,1)} h / ${maxWaterAgeTank.waterAge} h`, avgWaterAge>16?'warn':'ok', maxWaterAgeTank.name)
  );

  // 2. Operations
  const scadaCls = (scadaOfflineTanks+sensorOfflineLines)>0 ? 'bad' : 'ok';
  const pressCls = pressureLoggedPct<100 ? 'warn' : 'ok';
  const valveCls = valveThrottled>3 ? 'warn' : valveThrottled>0 ? 'warn' : 'ok';
  const maintCls = maintOverdueTanks.length>0 ? 'bad' : 'ok';
  const opState = worst(scadaCls, pressCls, valveCls, maintCls);
  const ops = paramCard('Operations', opState,
    prow('SCADA / sensors online', `${fmt(scadaOnlinePct,1)}%`, scadaCls, (scadaOfflineTanks+sensorOfflineLines)?`${scadaOfflineTanks+sensorOfflineLines} offline`:`${scadaTotalAssets} of ${scadaTotalAssets}`) +
    prow('Pressure &amp; flow monitoring', `${fmt(pressureLoggedPct,1)}%`, pressCls, `${validLines.length}/${LINES.length} lines reporting`) +
    prow('Valve control', `${valveThrottled} throttled`, valveCls, `of ${TANKS.length} outlet valves`) +
    prow('Maintenance schedule', maintOverdueTanks.length ? `${maintOverdueTanks.length} overdue` : 'On schedule', maintCls, `${TANKS.length} assets tracked`)
  );

  // 3. Pipe characteristics
  const roughCls = roughLines.length>0 ? 'warn' : 'ok';
  const matStr = Object.entries(pipeMaterialCounts).map(([m,c])=>`${m} ${c}`).join(' · ');
  const pipeState = worst(roughCls);
  const pipe = paramCard('Pipe characteristics', pipeState,
    prow('Diameter (range)', `${pipeDiaMin}–${pipeDiaMax} mm`, 'neutral') +
    prow('Material mix', matStr, (pipeMaterialCounts['CI']||0)>0?'warn':'neutral') +
    prow('Age (avg / oldest)', `${fmt(avgPipeAge,1)} / ${oldestLine.age} yr`, oldestLine.age>30?'warn':'neutral', oldestLine.id) +
    prow('Roughness (avg C)', fmt(avgRoughness,0), roughCls, roughLines.length?`${roughLines.length} lines C<${ROUGHNESS_RISK_MAX}`:'design range') +
    prow('Length (total)', `${fmt(totalPipeLengthKm,1)} km`, 'neutral') +
    prow('Pressure rating', `PN16 ×${pn16Count} · PN10 ×${pn10Count}`, 'neutral', 'trunk / distribution class')
  );

  // 4. Demand
  const peakCls = totalPeakHourDemandMLD>sourceCapacityTotalMLD ? 'bad' : totalPeakHourDemandMLD>sourceOutputTotalMLD ? 'warn' : 'ok';
  const demandState = worst(peakCls);
  const demand = paramCard('Demand', demandState,
    prow('Population served', fmt(totalPopulation), 'neutral') +
    prow('Per-capita use', `${perCapitaLPCD} LPCD`, perCapitaLPCD<135?'warn':'ok', 'norm 135 LPCD') +
    prow('Peak-hour demand', `${fmt(totalPeakHourDemandMLD,1)} MLD`, peakCls, `×${fmt(avgPeakFactor,2)} avg factor`) +
    prow('Seasonal variation', `+${seasonalVarMin}–${seasonalVarMax}%`, 'neutral', 'summer peak vs annual avg') +
    prow('Fire-flow demand', `${fmt(totalFireFlowLPS)} L/s`, 'neutral', 'design reserve, IS 3844')
  );

  // 5. Water source & supply
  const utilCls = sourceUtilizationPct>90 ? 'warn' : 'ok';
  const relCls = minReliabilityWTP.w.reliabilityPct<97 ? 'warn' : 'ok';
  const reserveCls = minReserveWTP.w.reserveHrs<6 ? 'bad' : 'ok';
  const sourceState = worst(utilCls, relCls, reserveCls);
  const source = paramCard('Water source &amp; supply', sourceState,
    prow('Source capacity', `${fmt(sourceCapacityTotalMLD,1)} MLD`, 'neutral', `${Object.keys(WTP_INFO).length} WTPs`) +
    prow('Treatment-plant output', `${fmt(sourceOutputTotalMLD,1)} MLD`, utilCls, `${fmt(sourceUtilizationPct,1)}% utilised`) +
    prow('Reliability (avg)', `${fmt(avgReliabilityPct,1)}%`, relCls, `lowest ${minReliabilityWTP.name.replace(' WTP','')} ${minReliabilityWTP.w.reliabilityPct}%`) +
    prow('Reserve supply (min)', `${minReserveWTP.w.reserveHrs} h`, reserveCls, minReserveWTP.name)
  );

  // 6. Economics & sustainability
  const replCls = assetsDueReplacementPct>15 ? 'warn' : 'ok';
  const equityCls = equityIndexPct<70 ? 'bad' : equityIndexPct<85 ? 'warn' : 'ok';
  const econState = worst(replCls, equityCls);
  const econ = paramCard('Economics &amp; sustainability', econState,
    prow('Capital cost', `₹${fmt(ECONOMICS.capitalAssetValueCr)} Cr`, 'neutral', 'network asset value') +
    prow('Operating cost', `₹${fmt(ECONOMICS.annualOpexCr)} Cr/yr`, 'neutral', `₹${fmt(costPerKL,2)}/KL`) +
    prow('Energy use', `${fmt(totalEnergyMWhPerDay,1)} MWh/day`, 'neutral', `${ECONOMICS.energyKwhPerML} kWh/ML`) +
    prow('Lifecycle replacement', `${fmt(assetsDueReplacementPct,1)}%`, replCls, 'of network due') +
    prow('Equity of access', `${fmt(equityIndexPct,0)}%`, equityCls, 'min ÷ max zone LPCD')
  );

  return `<div class="paramgrid">${wq}${ops}${pipe}${demand}${source}${econ}</div>`;
}

function schematicSVG(){
  // WTP nodes feeding zone hubs — abstract flow schematic, all 7 zones in 3 rows so nothing clips
  const wtpPos = [{x:150,y:30,name:'Jaspur WTP'},{x:430,y:30,name:'Raska WTP'},{x:660,y:30,name:'Kotarpur WTP'}];
  let s = `<svg viewBox="0 0 760 470" width="100%" style="min-width:640px" role="img" aria-label="Water network schematic from treatment plants to zones">`;
  const zoneList = Object.keys(ZONEPOS_OVERVIEW);
  zoneList.forEach(zid=>{
    const zlines = linesIn(zid).filter(l=>l.type==='Trunk Main');
    zlines.forEach(l=>{
      const wtp = wtpPos.find(w=>w.name===l.from) || wtpPos[0];
      const zp = ZONEPOS_OVERVIEW[zid];
      const zoneStatus = worstStatusForZone(zid);
      const col = zoneStatus==='critical' ? 'var(--red)' : zoneStatus==='warning' ? 'var(--amber)' : 'var(--teal)';
      s += `<path d="M${wtp.x} ${wtp.y+16} C ${wtp.x} ${(wtp.y+zp.y)/2}, ${zp.x} ${(wtp.y+zp.y)/2}, ${zp.x} ${zp.y-30}" fill="none" stroke="${col}" stroke-width="1.6" opacity="0.55" stroke-dasharray="4 3"/>`;
    });
  });
  wtpPos.forEach(w=>{
    s += `<rect x="${w.x-52}" y="${w.y-16}" width="104" height="32" rx="6" fill="var(--panel)" stroke="var(--sky)" stroke-width="1"/>`;
    s += `<text x="${w.x}" y="${w.y+4}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="var(--text)">${w.name}</text>`;
  });
  zoneList.forEach(zid=>{
    const zp = ZONEPOS_OVERVIEW[zid];
    const z = zoneOf(zid);
    const zoneStatus = worstStatusForZone(zid);
    const col = zoneStatus==='critical' ? 'var(--red)' : zoneStatus==='warning' ? 'var(--amber)' : 'var(--teal)';
    const zTanks = tanksIn(zid);
    const avgLvl = Math.round(zTanks.reduce((s,t)=>s+t.level,0)/zTanks.length);
    s += `<g style="cursor:pointer" onclick="openZoneDrawer('${zid}')">`;
    s += `<circle cx="${zp.x}" cy="${zp.y}" r="32" fill="var(--panel2)" stroke="${col}" stroke-width="1.6"/>`;
    s += `<text x="${zp.x}" y="${zp.y-5}" text-anchor="middle" font-family="IBM Plex Sans" font-weight="600" font-size="11" fill="var(--text)">${zid}</text>`;
    s += `<text x="${zp.x}" y="${zp.y+12}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="${col}">${avgLvl}%</text>`;
    s += `<text x="${zp.x}" y="${zp.y+50}" text-anchor="middle" font-family="IBM Plex Sans" font-size="9.5" fill="var(--text-dim)">${z.name}</text>`;
    s += `</g>`;
  });
  s += `</svg>`;
  return s;
}
function selectZoneFromOverview(zid){ openZoneDrawer(zid); }
function worstStatusForZone(zid){
  const zl = linesIn(zid);
  const zt = tanksIn(zid);
  if(zl.some(l=>['Leakage Suspected','Blockage Suspected'].includes(l.status)) || zt.some(t=>t.status==='Critical')) return 'critical';
  if(zl.some(l=>l.status==='Sensor Offline') || zt.some(t=>t.status==='Low')) return 'warning';
  return 'normal';
}

function viewAreas(){

    ${rows.map(r=>`

        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <b>${r.z.name}</b><span style="font-family:var(--mono); font-size:11px; color:${r.alertCount>0?'var(--red)':'var(--text-mute)'}">${r.alertCount} alert(s)</span>
        </div>
        <div class="barmini"><div style="width:${Math.min(100,r.supplyMld/r.demandMld*100)}%; background:${r.deficit>=0?'var(--teal)':'var(--amber)'};"></div></div>
        <div class="statrow">
          <div>Supply <b>${fmt(r.supplyMld,1)} MLD</b></div>
          <div>Demand <b>${fmt(r.demandMld,1)} MLD</b></div>
          <div>LPCD <b>${r.lpcd}</b></div>
          <div>vs yesterday <b style="color:${r.changePct>=0?'var(--green)':'var(--red)'}">${r.changePct>=0?'+':''}${fmt(r.changePct,1)}%</b></div>
          <div>Peak-hr <b style="color:${r.peakDeficit<0?'var(--red)':'inherit'}">${fmt(r.peakMld,1)} MLD</b></div>
          <div>Fire-flow <b>${r.z.fireFlowLPS} L/s</b></div>
        </div>
      </div>`).join('')}
  </div>`;
}

function bigMapSVG(){
  const zoneList = Object.keys(ZONEPOS_MAP);
  let s = `<svg viewBox="0 0 780 660" width="100%" style="max-width:560px; display:block; margin:0 auto;" role="img" aria-label="Map of Ahmedabad water distribution zones, treatment plants and trunk mains around the Sabarmati river">`;

  // River (curved, highlighted)
  s += `<path d="${RIVER_PATH}" fill="none" stroke="var(--river)" stroke-width="16" opacity="0.55" stroke-linecap="round"/>`;
  s += `<path d="${RIVER_PATH}" fill="none" stroke="var(--river-core)" stroke-width="3" opacity="0.7" stroke-linecap="round"/>`;
  s += `<text x="440" y="45" font-family="IBM Plex Mono" font-size="11" fill="var(--river-label)">Sabarmati river</text>`;

  // Trunk mains: WTP -> zone hub, thickness scaled to diameter
  zoneList.forEach(zid=>{
    const zp = ZONEPOS_MAP[zid];
    linesIn(zid).filter(l=>l.type==='Trunk Main').forEach(l=>{
      const wtp = WTP_POS[l.from];
      if(!wtp) return;
      const col = l.status==='Leakage Suspected'||l.status==='Blockage Suspected' ? 'var(--red)' : l.status==='Sensor Offline' ? 'var(--purple)' : 'var(--teal)';
      const w = Math.max(2, l.dia/140);
      const midx = (wtp.x+zp.x)/2 + (zp.x>wtp.x?-20:20);
      const midy = (wtp.y+zp.y)/2;
      s += `<path d="M${wtp.x} ${wtp.y} Q ${midx} ${midy}, ${zp.x} ${zp.y}" fill="none" stroke="${col}" stroke-width="${w}" opacity="0.8"/>`;
    });
  });

  // Distribution main spokes off each zone hub
  zoneList.forEach(zid=>{
    const zp = ZONEPOS_MAP[zid];
    const dmains = linesIn(zid).filter(l=>l.type==='Distribution Main');
    dmains.forEach((l,i)=>{
      const angleDeg = 205 + i*130;
      const rad = angleDeg*Math.PI/180;
      const len = 58;
      const ex = zp.x + Math.cos(rad)*len;
      const ey = zp.y + Math.sin(rad)*len;
      const col = l.status==='Leakage Suspected'||l.status==='Blockage Suspected' ? 'var(--red)' : 'var(--wire)';
      s += `<line x1="${zp.x}" y1="${zp.y}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="2" opacity="0.85"/>`;
      s += `<circle cx="${ex}" cy="${ey}" r="3" fill="${col}"/>`;
      const lblX = zp.x + Math.cos(rad)*(len+8);
      const lblY = zp.y + Math.sin(rad)*(len+8);
      const anchor = Math.cos(rad) > 0.3 ? 'start' : Math.cos(rad) < -0.3 ? 'end' : 'middle';
      s += `<text x="${lblX}" y="${lblY}" text-anchor="${anchor}" font-family="IBM Plex Mono" font-size="9" fill="var(--text-mute)">${l.to.split('/')[0].trim().slice(0,16)}</text>`;
    });
  });

  // WTP nodes
  Object.entries(WTP_POS).forEach(([name,p])=>{
    s += `<g style="cursor:pointer" onclick="highlightWtp('${name}')">
      <rect x="${p.x-56}" y="${p.y-18}" width="112" height="36" rx="6" fill="var(--panel)" stroke="var(--sky)" stroke-width="1.4"/>
      <text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="var(--text)">${name}</text>
    </g>`;
  });

  // Zone hubs
  zoneList.forEach(zid=>{
    const zp = ZONEPOS_MAP[zid];
    const z = zoneOf(zid);
    const st = worstStatusForZone(zid);
    const col = st==='critical'?'var(--red)':st==='warning'?'var(--amber)':'var(--teal)';
    const zTanks = tanksIn(zid);
    const avgLvl = Math.round(zTanks.reduce((s,t)=>s+t.level,0)/zTanks.length);
    const isSel = selectedZoneId===zid;
    s += `<g style="cursor:pointer" onclick="openZoneDrawer('${zid}')">`;
    s += `<circle cx="${zp.x}" cy="${zp.y}" r="40" fill="var(--panel2)" stroke="${col}" stroke-width="${isSel?3.5:2}"/>`;
    if(isSel) s += `<circle cx="${zp.x}" cy="${zp.y}" r="46" fill="none" stroke="${col}" stroke-width="1" opacity="0.5"/>`;
    s += `<text x="${zp.x}" y="${zp.y-8}" text-anchor="middle" font-family="IBM Plex Sans" font-weight="600" font-size="12" fill="var(--text)">${zid}</text>`;
    s += `<text x="${zp.x}" y="${zp.y+9}" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="${col}">${avgLvl}%</text>`;
    s += `<text x="${zp.x}" y="${zp.y+24}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="var(--text-dim)">${zTanks.length}T · ${linesIn(zid).length}L</text>`;
    s += `</g>`;
    s += `<text x="${zp.x}" y="${zp.y+64}" text-anchor="middle" font-family="IBM Plex Sans" font-size="10" fill="var(--text-dim)">${z.name}</text>`;
  });

  s += `</svg>`;
  return s;
}
function highlightWtp(name){
  const feedLines = LINES.filter(l=>l.type==='Trunk Main' && l.from===name);
  const totalFeed = feedLines.reduce((s,l)=>s+l.input,0);
  openWtpDrawer(name, feedLines, totalFeed);
}

function exportCSV(kind){
  let rows = [], filename = '';
  if(kind==='tanks'){
    filename = 'amc_tank_levels.csv';
    rows.push(['Tank ID','Name','Type','Zone','Capacity (KL)','Level %','Inflow (KLD)','Outflow (KLD)','Turbidity (NTU)','pH','Res. Chlorine (mg/L)','Water Age (h)','Contamination Risk','Valve','SCADA Link','Last Maint.','Next Maint.','Pump','Status']);
    TANKS.forEach(t=>rows.push([t.id,t.name,t.type,zoneOf(t.zone).name,t.cap,t.level,t.inflow,t.outflow,t.turbidity,t.ph,t.chlorine,t.waterAge,t.contam,t.valve,t.scada,t.lastMaint,t.nextMaint,t.pump,t.status]));
  } else if(kind==='lines'){
    filename = 'amc_distribution_lines.csv';
    rows.push(['Line ID','Zone','Type','From','To','Diameter (mm)','Material','Length (km)','Input (KLD)','Output (KLD)','NRW %','Pressure In (mwc)','Pressure Out (mwc)','Pressure Rating (mwc)','Velocity (m/s)','Roughness (C)','Age (yr)','Status']);
    LINES.forEach(l=>{
      const nrw = l.output===null?'':((l.input-l.output)/l.input*100).toFixed(1);
      rows.push([l.id,l.zone,l.type,l.from,l.to,l.dia,l.material,l.length,l.input,l.output===null?'':l.output,nrw,l.pin,l.pout===null?'':l.pout,l.pressureRating,l.vel===null?'':l.vel,l.roughness,l.age,l.status]);
    });
  } else if(kind==='areas'){
    filename = 'amc_area_wise_supply.csv';
    rows.push(['Zone','Areas','Population','Supply (MLD)','Demand (MLD)','Per-capita (LPCD)','Peak-Hour Demand (MLD)','Peak Factor','Seasonal Variation (%)','Fire-Flow Demand (L/s)','Supply hrs/day']);
    ZONES.forEach(z=>{
      const zt = tanksIn(z.id);
      const supplyMld = zt.reduce((s,t)=>s+t.outflow,0)/1000;
      const demandMld = z.population*135/1e6;
      const lpcd = Math.round(supplyMld*1e6/z.population);
      rows.push([z.name, z.areas.join(' | '), z.population, supplyMld.toFixed(1), demandMld.toFixed(1), lpcd, (demandMld*z.peakFactor).toFixed(1), z.peakFactor, z.seasonalVariationPct, z.fireFlowLPS, supplyMld>=demandMld?5:3]);
    });
  } else if(kind==='alerts'){
    filename = 'amc_alerts_log.csv';
    rows.push(['Type','Severity','ID','Zone','Location','Parameter','Method','Est. Loss (KLD)','Action']);
    ALERTS.forEach(a=>rows.push([a.type,a.sev,a.line,zoneOf(a.zone).name,a.location,a.param,a.method,a.loss||'',a.action]));
  } else if(kind==='economics'){
    filename = 'amc_economics_sustainability.csv';
    rows.push(['Metric','Value','Unit']);
    rows.push(['Capital asset value', ECONOMICS.capitalAssetValueCr, 'Cr INR']);
    rows.push(['Annual operating cost', ECONOMICS.annualOpexCr, 'Cr INR/yr']);
    rows.push(['Cost per KL delivered', costPerKL.toFixed(2), 'INR/KL']);
    rows.push(['Energy use', totalEnergyMWhPerDay.toFixed(1), 'MWh/day']);
    rows.push(['Energy intensity', ECONOMICS.energyKwhPerML, 'kWh/ML']);
    rows.push(['Lifecycle replacement due', assetsDueReplacementPct.toFixed(1), '% of network']);
    rows.push(['Equity of access index', equityIndexPct.toFixed(0), '% (min/max zone LPCD)']);
    rows.push([]);
    rows.push(['WTP','Capacity (MLD)','Output (MLD)','Reliability (%)','Reserve Supply (h)']);
    Object.entries(WTP_INFO).forEach(([name,w])=>{
      const outputMLD = LINES.filter(l=>l.type==='Trunk Main'&&l.from===name).reduce((s,l)=>s+l.input,0)/1000;
      rows.push([name, w.capacityMLD, outputMLD.toFixed(1), w.reliabilityPct, w.reserveHrs]);
    });
  }
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Theme toggle — light is the default; the choice is remembered per browser via localStorage. */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if(icon) icon.textContent = theme==='dark' ? '☾' : '☀';
  if(label) label.textContent = theme==='dark' ? 'Dark' : 'Light';
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
  const next = current==='dark' ? 'light' : 'dark';
  try{ localStorage.setItem('jalsetu-theme', next); }catch(e){}
  applyTheme(next);
}
applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light');

renderNav();
renderView();
